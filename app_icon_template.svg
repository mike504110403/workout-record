<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景漸層 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dumbbellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圓角背景 -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="url(#bgGradient)"/>
  
  <!-- 啞鈴圖示 -->
  <g transform="translate(512, 512)">
    <!-- 左側重量片 -->
    <rect x="-320" y="-40" width="80" height="80" rx="8" fill="url(#dumbbellGradient)"/>
    <rect x="-300" y="-20" width="40" height="40" rx="4" fill="#ffffff" opacity="0.3"/>
    
    <!-- 中間握把 -->
    <rect x="-120" y="-20" width="240" height="40" rx="20" fill="#ffffff" opacity="0.9"/>
    <rect x="-100" y="-10" width="200" height="20" rx="10" fill="url(#dumbbellGradient)"/>
    
    <!-- 右側重量片 -->
    <rect x="240" y="-40" width="80" height="80" rx="8" fill="url(#dumbbellGradient)"/>
    <rect x="260" y="-20" width="40" height="40" rx="4" fill="#ffffff" opacity="0.3"/>
    
    <!-- 裝飾線條 -->
    <line x1="-200" y1="-60" x2="200" y2="-60" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
    <line x1="-200" y1="60" x2="200" y2="60" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  </g>
  
  <!-- 文字標記 -->
  <text x="512" y="800" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#ffffff" opacity="0.8">WR</text>
</svg>
